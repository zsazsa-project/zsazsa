{# Shared by pir_list and rfi_list: the inline triage accordion toggle, the
   untriaged-row highlight, and showing the reason / merge inputs based on the
   selected decision. Decisions that need a reason carry data-needs-reason="1";
   the PIR merge option carries data-needs-merge="1". #}
<style>
  .triage-pending-row > td { background-color: var(--triage-pending-bg, #fff7e6); }
  .triage-pending-row { scroll-margin-top: 5rem; }
</style>
<script>
(function() {
  document.querySelectorAll('.triage-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var row = document.getElementById(btn.dataset.target);
      if (!row) return;
      var hidden = row.classList.toggle('d-none');
      btn.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      btn.classList.toggle('active', !hidden);
    });
  });

  // A Triage button outside the table, such as on a board card, opens the
  // same row through its toggle and scrolls to it.
  document.querySelectorAll('.triage-open').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var row = document.getElementById(btn.dataset.target);
      if (!row) return;
      var toggle = document.querySelector('.triage-toggle[data-target="' + btn.dataset.target + '"]');
      if (toggle && row.classList.contains('d-none')) toggle.click();
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  // Arriving from a record's page through "Triage it on the list", with the
  // record in ?triage=: open its triage form and scroll to its row.
  var arrived = new URLSearchParams(location.search).get('triage');
  var arrivedToggle = arrived && document.querySelector('tr[data-req-id="' + CSS.escape(arrived) + '"] .triage-toggle');
  if (arrivedToggle) {
    arrivedToggle.click();
    arrivedToggle.closest('tr').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showDecisionInputs(form) {
    var sel = form.querySelector('.triage-decision:checked');
    var needsReason = !!(sel && sel.dataset.needsReason === '1');
    var needsMerge = !!(sel && sel.dataset.needsMerge === '1');
    var reasonWrap = form.querySelector('.triage-reason-wrap');
    var mergeWrap = form.querySelector('.triage-merge-wrap');
    if (reasonWrap) {
      reasonWrap.style.display = needsReason ? '' : 'none';
      var ta = reasonWrap.querySelector('textarea');
      if (ta) ta.required = needsReason;
    }
    if (mergeWrap) {
      mergeWrap.style.display = needsMerge ? '' : 'none';
      var msel = mergeWrap.querySelector('select');
      if (msel) msel.required = needsMerge;
    }
  }

  document.querySelectorAll('.triage-form').forEach(showDecisionInputs);

  document.addEventListener('change', function(e) {
    var radio = e.target.closest ? e.target.closest('.triage-decision') : null;
    var form = radio ? radio.closest('.triage-form') : null;
    if (form) showDecisionInputs(form);
  });
})();
</script>
