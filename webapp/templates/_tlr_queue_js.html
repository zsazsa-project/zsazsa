{# Asks the route of a tlr_queue_button to queue the product's source
   articles for the threat landscape, and shows its answer over the page. #}
<script>
(function() {
  function say(message, ok) {
    var container = document.getElementById('flash-container');
    var alert = document.createElement('div');
    alert.className = 'alert alert-' + (ok ? 'success' : 'warning') + ' alert-dismissible fade show alert-flash';
    alert.setAttribute('role', 'alert');
    var text = document.createElement('span');
    text.textContent = message;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'btn-close';
    close.setAttribute('data-bs-dismiss', 'alert');
    close.setAttribute('aria-label', 'Close');
    alert.append(text, close);
    container.appendChild(alert);
  }

  document.querySelectorAll('[data-tlr-url]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="tlr-lbl"> Queueing…</span>';
      var csrf = document.querySelector('meta[name="csrf-token"]');
      fetch(btn.dataset.tlrUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf ? csrf.content : ''},
        body: JSON.stringify(btn.dataset.tlrUuid ? {uuid: btn.dataset.tlrUuid} : {})
      })
      .then(zsazsaReadJson)
      .then(function(data) {
        say(data.message || ('Could not queue the articles: ' + (data.error || 'unknown error')), data.ok);
        if (data.ok) {
          btn.innerHTML = '<i class="fas fa-check"></i><span class="tlr-lbl"> Queued for threat landscape</span>';
        } else {
          btn.innerHTML = originalHtml;
          btn.disabled = false;
        }
      })
      .catch(function(err) {
        say('Could not queue the articles: ' + zsazsaErrorText(err), false);
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      });
    });
  });
})();
</script>
