name: release

on:
  # Releases are made on GitHub, which creates the tag along with them.
  release:
    types: [published]

# Least privilege. Only the SBOM upload writes, and only to the release.
permissions:
  contents: read

jobs:
  version:
    name: tag matches version.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the commit the release tag points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every page shows APP_VERSION in its footer and puts it on the stylesheet
      # URL, so a version left behind shows the wrong release and keeps the old
      # stylesheet cached. The tag goes in through env, not into the script
      # itself: a tag name is free text.
      - name: Compare the tag with APP_VERSION
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("webapp/version.py")["APP_VERSION"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error file=webapp/version.py::The release is tagged $TAG, but webapp/version.py says $version. Tag it v$version, or set APP_VERSION to match."
            exit 1
          fi
          echo "Tag $TAG matches APP_VERSION $version."

  sbom:
    name: build the SBOM
    # A release whose tag does not match APP_VERSION gets no SBOM: it would
    # name a version that is not the code.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The SBOM is taken from an installation of the lock rather than from the
      # file, because only an installed package has its licence and the rest
      # of its metadata. The environment has no pip of its own, which zsazsa
      # does not depend on and the SBOM would otherwise list.
      - name: Install the requirements in an environment of their own
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/app"
          pip --python "$RUNNER_TEMP/app/bin/python" install -r requirements.txt
          pip install 'cyclonedx-bom>=7.5,<8'

      # zsazsa has no pyproject.toml, which is where cyclonedx-py reads the
      # SBOM's own subject from. This one exists only for the run, so the SBOM
      # names zsazsa, its version and licence, and its direct dependencies:
      # those in requirements.in, not every package in the lock.
      - name: Describe zsazsa for the SBOM
        run: |
          python - "$RUNNER_TEMP/pyproject.toml" <<'EOF'
          import json, runpy, sys
          version = runpy.run_path("webapp/version.py")["APP_VERSION"]
          deps = [line.split("#")[0].strip() for line in open("requirements.in")]
          with open(sys.argv[1], "w") as f:
              f.write(f'[project]\nname = "zsazsa"\nversion = "{version}"\nlicense = "AGPL-3.0-only"\n'
                      f'dependencies = {json.dumps([d for d in deps if d])}\n')
          EOF

      - name: Generate the SBOM
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cyclonedx-py environment --pyproject "$RUNNER_TEMP/pyproject.toml" \
            --of XML --sv 1.4 -o "zsazsa-$TAG.cdx.xml" "$RUNNER_TEMP/app/bin/python"
          python .github/scripts/sbom_supplier.py "zsazsa-$TAG.cdx.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: zsazsa-*.cdx.xml
          retention-days: 1

  # zsazsa together with the misp-scraper that feeds it, each application
  # with its own packages under it, as one SBOM for a whole installation. The
  # scraper is the one in its latest release; when it releases again, running
  # this workflow again on zsazsa's release replaces the file.
  deployment-sbom:
    name: build the deployment SBOM
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # For the validation in sbom_supplier.py.
      - run: pip install 'cyclonedx-bom>=7.5,<8'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Fetch the misp-scraper SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo cudeso/misp-scraper --pattern 'misp-scraper-*.cdx.xml'

      # CycloneDX's own tool, for its hierarchical merge: it nests each SBOM
      # under its application and prefixes every bom-ref with the application's
      # name and version, so a package both use is not one ref twice. The
      # release publishes no checksums, so the hash is the one GitHub recorded
      # for the asset when this version was pinned.
      - name: Install cyclonedx-cli
        env:
          VERSION: 0.33.1
          SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${VERSION}/cyclonedx-linux-x64"
          echo "$SHA256  $RUNNER_TEMP/cyclonedx" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cyclonedx"

      - name: Merge the two
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          "$RUNNER_TEMP/cyclonedx" merge --hierarchical --name "zsazsa deployment" --version "${TAG#v}" \
            --input-files "zsazsa-$TAG.cdx.xml" misp-scraper-*.cdx.xml \
            --input-format xml --output-format xml --output-version v1_4 \
            --output-file "zsazsa-deployment-$TAG.cdx.xml"
          python .github/scripts/sbom_supplier.py "zsazsa-deployment-$TAG.cdx.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-sbom
          path: zsazsa-deployment-*.cdx.xml
          retention-days: 1

  # The upload is a job of its own because it is the only one that can write.
  # The builds above run what pip installed and a downloaded binary, and code
  # running in a job can reach that job's token. This one runs neither.
  #
  # zsazsa's own SBOM does not wait on the deployment one: a scraper release
  # that cannot be fetched fails that job, shown in red, and the release still
  # gets the SBOM that describes it.
  sbom-upload:
    name: attach the SBOMs to the release
    needs: [sbom, deployment-sbom]
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*sbom"
          merge-multiple: true

      - name: Upload them to the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ./*.cdx.xml --clobber --repo "$GITHUB_REPOSITORY"
